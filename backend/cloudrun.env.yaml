# Non-secret environment variables for the Cloud Run service, passed with
#   gcloud run deploy ... --env-vars-file backend/cloudrun.env.yaml
# API keys are NOT here — they come from Secret Manager via --set-secrets.
FIREBASE_PROJECT_ID: book-finder-assistant
# The two domains Firebase Hosting serves the frontend on. Add a custom domain here if you set one up.
CORS_ORIGINS: https://book-finder-assistant.web.app,https://book-finder-assistant.firebaseapp.com
